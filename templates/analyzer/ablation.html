{% extends 'base/base.html' %}
{% load static %}

{% block title %}消融實驗分析 - VNAAP{% endblock %}

{% block extra_css %}
<style>
    .ablation-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    
    .panel {
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
    }
    
    .panel-title {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 15px;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .panel-title i {
        color: var(--accent);
    }
    
    .form-group {
        margin-bottom: 15px;
    }
    
    .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 10px;
        margin-top: 10px;
    }
    
    .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.03);
        padding: 10px;
        border-radius: 6px;
        border: 1px solid var(--border2);
        cursor: pointer;
        transition: var(--transition);
    }
    
    .checkbox-item:hover {
        border-color: var(--accent);
        background: rgba(99, 102, 241, 0.05);
    }
    
    .checkbox-item input[type="checkbox"] {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
    }
    
    .terminal-container {
        background: #010409;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 15px;
        font-family: var(--mono);
        font-size: 0.85rem;
        color: #e6edf3;
        height: 300px;
        overflow-y: auto;
        white-space: pre-wrap;
        line-height: 1.5;
    }
    
    .terminal-container::-webkit-scrollbar {
        width: 8px;
    }
    
    .terminal-container::-webkit-scrollbar-thumb {
        background-color: #30363d;
        border-radius: 4px;
    }
    
    .results-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }
    
    .result-card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
    }
    
    .result-card h4 {
        margin-bottom: 15px;
        color: #e6edf3;
    }
    
    .result-image {
        max-width: 100%;
        height: auto;
        border-radius: 4px;
        border: 1px solid #30363d;
    }
    
    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
    }
    
    .status-idle { background: rgba(255, 255, 255, 0.1); color: #8b949e; }
    .status-running { background: rgba(56, 139, 253, 0.15); color: #58a6ff; }
    .status-done { background: rgba(46, 160, 67, 0.15); color: #3fb950; }
    .status-error { background: rgba(248, 81, 73, 0.15); color: #f85149; }
    
    .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-bar">
    <div>
        <h1 class="page-title">消融實驗分析 (Ablation Study)</h1>
        <p class="page-sub">探索不同模型架構與參數設定對異常檢測效能的影響。</p>
    </div>
</div>

<div class="ablation-container">
    <!-- 控制面板 -->
    <div class="panel">
        <div class="panel-title">
            <i class="fas fa-sliders-h"></i> 實驗設定
        </div>
        
        <form id="ablation-form">
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">資料集選擇</label>
                    <select class="form-input" id="dataset-select" name="dataset">
                        <option value="simulate">Simulate (模擬輕量資料 - 快速)</option>
                        <option value="nslkdd">NSL-KDD (中型資料)</option>
                        <option value="cicids2017">CIC-IDS2017 (真實龐大資料 - 較慢)</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">選擇要執行的消融實驗項目</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item">
                        <input type="checkbox" name="experiments" value="all" checked>
                        <span>全部執行 (All)</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="experiments" value="latent">
                        <span>Latent Dimension (潛在維度)</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="experiments" value="arch">
                        <span>Architecture Scale (架構寬度)</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="experiments" value="size">
                        <span>Image Size (影像尺寸)</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="experiments" value="mask">
                        <span>Field Masking (欄位遮罩)</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="experiments" value="data">
                        <span>Data Size (訓練資料量)</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="experiments" value="act">
                        <span>Activation (激活函數)</span>
                    </label>
                </div>
            </div>
            
            <div class="flex items-center justify-between mt-3">
                <div id="status-container">
                    <span class="status-badge status-idle" id="current-status">
                        <i class="fas fa-pause-circle"></i> 尚未執行
                    </span>
                </div>
                <button type="button" class="btn-primary" id="btn-run">
                    <i class="fas fa-play"></i> 開始實驗
                </button>
            </div>
        </form>
    </div>
    
    <!-- 終端機輸出 -->
    <div class="panel">
        <div class="panel-title justify-between">
            <div><i class="fas fa-terminal"></i> 執行日誌 (Terminal)</div>
            <button class="btn-ghost btn-sm" id="btn-refresh-log">
                <i class="fas fa-sync-alt"></i> 更新
            </button>
        </div>
        <div class="terminal-container" id="terminal-output">等待執行...</div>
    </div>
    
    <!-- 結果展示區 -->
    <div class="panel" id="results-panel" style="display: none;">
        <div class="panel-title">
            <i class="fas fa-chart-bar"></i> 實驗結果圖表
        </div>
        <div class="results-grid" id="results-grid">
            <!-- 圖表將由 JS 動態插入 -->
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const btnRun = document.getElementById('btn-run');
    const btnRefresh = document.getElementById('btn-refresh-log');
    const terminalOutput = document.getElementById('terminal-output');
    const statusBadge = document.getElementById('current-status');
    const resultsPanel = document.getElementById('results-panel');
    const resultsGrid = document.getElementById('results-grid');
    const datasetSelect = document.getElementById('dataset-select');
    
    let pollInterval = null;
    
    // 全選/取消全選邏輯
    const allCheckbox = document.querySelector('input[value="all"]');
    const expCheckboxes = document.querySelectorAll('input[name="experiments"]:not([value="all"])');
    
    allCheckbox.addEventListener('change', function() {
        expCheckboxes.forEach(cb => {
            cb.checked = false;
            cb.disabled = this.checked;
        });
    });
    
    expCheckboxes.forEach(cb => {
        cb.addEventListener('change', function() {
            if (this.checked) {
                allCheckbox.checked = false;
            }
        });
    });
    
    // 初始化 Checkbox 狀態
    expCheckboxes.forEach(cb => cb.disabled = true);
    
    function updateStatusUI(status) {
        statusBadge.className = 'status-badge';
        if (status === 'running') {
            statusBadge.classList.add('status-running');
            statusBadge.innerHTML = '<span class="spinner"></span> 正在執行中...';
            btnRun.disabled = true;
        } else if (status === 'done') {
            statusBadge.classList.add('status-done');
            statusBadge.innerHTML = '<i class="fas fa-check-circle"></i> 實驗完成';
            btnRun.disabled = false;
        } else if (status === 'error') {
            statusBadge.classList.add('status-error');
            statusBadge.innerHTML = '<i class="fas fa-exclamation-triangle"></i> 執行失敗';
            btnRun.disabled = false;
        } else {
            statusBadge.classList.add('status-idle');
            statusBadge.innerHTML = '<i class="fas fa-pause-circle"></i> 尚未執行';
            btnRun.disabled = false;
        }
    }
    
    function renderImages(images) {
        if (!images || Object.keys(images).length === 0) return;
        
        resultsPanel.style.display = 'block';
        resultsGrid.innerHTML = '';
        
        for (const [filename, url] of Object.entries(images)) {
            const title = filename.replace('ablation_', '').replace('.png', '').replace(/_/g, ' ').toUpperCase();
            
            const card = document.createElement('div');
            card.className = 'result-card fade-in';
            card.innerHTML = `
                <h4>${title}</h4>
                <a href="${url}" target="_blank">
                    <img src="${url}" class="result-image" alt="${title}">
                </a>
            `;
            resultsGrid.appendChild(card);
        }
    }
    
    function fetchStatus() {
        const dataset = datasetSelect.value;
        fetch(`/analyzer/ablation/api/status/?dataset=${dataset}`)
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    updateStatusUI(data.status);
                    
                    if (data.logs) {
                        terminalOutput.textContent = data.logs;
                        terminalOutput.scrollTop = terminalOutput.scrollHeight;
                    }
                    
                    if (data.status === 'done' || data.status === 'error') {
                        clearInterval(pollInterval);
                        pollInterval = null;
                        
                        if (data.status === 'done' && data.images) {
                            renderImages(data.images);
                        }
                    }
                }
            })
            .catch(err => console.error('Error fetching status:', err));
    }
    
    btnRun.addEventListener('click', function() {
        const dataset = datasetSelect.value;
        let experiments = [];
        
        if (allCheckbox.checked) {
            experiments = ['all'];
        } else {
            expCheckboxes.forEach(cb => {
                if (cb.checked) experiments.push(cb.value);
            });
            if (experiments.length === 0) {
                alert('請至少選擇一項實驗');
                return;
            }
        }
        
        // 重置 UI
        terminalOutput.textContent = '啟動中...';
        resultsPanel.style.display = 'none';
        updateStatusUI('running');
        
        // 發送執行請求
        fetch('/analyzer/ablation/api/run/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': VNAAP.getCookie('csrftoken')
            },
            body: JSON.stringify({
                dataset: dataset,
                experiments: experiments
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok) {
                // 開始輪詢
                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(fetchStatus, 2000);
            } else {
                alert('啟動失敗: ' + data.error);
                updateStatusUI('error');
            }
        })
        .catch(err => {
            console.error('Run API Error:', err);
            alert('系統錯誤');
            updateStatusUI('error');
        });
    });
    
    btnRefresh.addEventListener('click', fetchStatus);
    
    // 進入頁面時先抓一次狀態
    fetchStatus();
});
</script>
{% endblock %}
