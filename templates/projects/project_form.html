{% extends "base/base.html" %}
{% block title %}VNAAP — {{ action }}專案{% endblock %}
{% block content %}
<div class="page-bar">
  <div><div class="page-title">{{ action }} Project</div></div>
  <a href="{% if project %}{% url 'projects:detail' project.pk %}{% else %}{% url 'projects:list' %}{% endif %}" class="btn-ghost btn-sm">← Back</a>
</div>
<div style="max-width:560px">
  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Project Name <span style="color:var(--red)">*</span></label>
        <input type="text" name="name" class="form-input" required
               value="{{ form.name.value|default:'' }}" placeholder="e.g., Q1-Internal-Audit">
        {% for e in form.name.errors %}<div style="color:var(--red);font-size:.75rem;margin-top:4px">✗ {{ e }}</div>{% endfor %}
      </div>
      <div class="form-group">
        <label class="form-label">Network Segment</label>
        <input type="text" name="network_segment" class="form-input"
               value="{{ form.network_segment.value|default:'' }}" placeholder="e.g., 192.168.1.0/24">
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-input" rows="3"
                  placeholder="Describe the purpose of this project...">{{ form.description.value|default:'' }}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select name="status" class="form-input">
          {% for val, label in form.status.field.choices %}
          <option value="{{ val }}" {% if form.status.value == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="flex gap-2" style="margin-top:6px">
        <button type="submit" class="btn-primary">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><polyline points="20 6 9 17 4 12"/></svg>
          {{ action }} Project
        </button>
        <a href="{% if project %}{% url 'projects:detail' project.pk %}{% else %}{% url 'projects:list' %}{% endif %}" class="btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
